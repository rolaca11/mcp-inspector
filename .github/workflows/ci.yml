name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ppa:
    name: PPA packaging
    uses: ./.github/workflows/ppa.yml
    with:
      version: "0.0.0"
      ref: ${{ github.event.pull_request.head.sha || github.sha }}

  ci:
    name: Build & Typecheck
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Build Electron
        run: bun run --filter @rolaca11/mcp-inspector-electron build

      - name: Test
        run: bun run test

      - name: Build Debian package
        if: runner.os == 'Linux'
        run: bun run dist:deb

      - name: Install and verify Debian package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ./packages/electron/release/*.deb
          mcp-inspector --version
          bun scripts/verify-deb.mjs packages/electron/release/*.deb
