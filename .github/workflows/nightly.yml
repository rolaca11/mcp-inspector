name: Nightly Release

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC every night
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Check for changes
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes since last release
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_TAG=$(gh release view --json tagName --jq .tagName 2>/dev/null || echo "")

          if [ -z "$LATEST_TAG" ]; then
            echo "No GitHub release found — treating as changed"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            COMMITS_SINCE=$(git rev-list "${LATEST_TAG}..HEAD" --count)
            echo "Latest release tag: ${LATEST_TAG}"
            echo "Commits since: ${COMMITS_SINCE}"

            if [ "$COMMITS_SINCE" -gt 0 ]; then
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Create and push tag
        id: tag
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          TAG="v${BASE_VERSION}-nightly.$(date -u +'%Y%m%d')"
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: check
    if: needs.check.outputs.tag
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.check.outputs.tag }}
    secrets: inherit
