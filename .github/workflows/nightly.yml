name: Nightly Release

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC every night
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    name: Nightly Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes since last release
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_TAG=$(gh release view --json tagName --jq .tagName 2>/dev/null || echo "")

          if [ -z "$LATEST_TAG" ]; then
            echo "No GitHub release found — treating as changed"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            COMMITS_SINCE=$(git rev-list "${LATEST_TAG}..HEAD" --count)
            echo "Latest release tag: ${LATEST_TAG}"
            echo "Commits since: ${COMMITS_SINCE}"

            if [ "$COMMITS_SINCE" -gt 0 ]; then
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Install pnpm
        if: steps.changes.outputs.has_changes == 'true'
        uses: pnpm/action-setup@v4

      - name: Tag nightly version
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BASE_VERSION=$(node -p "require('./package.json').version")
          NIGHTLY_VERSION="${BASE_VERSION}-nightly.$(date -u +'%Y%m%d')"
          pnpm version "$NIGHTLY_VERSION"

      - name: Push tag
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git remote set-url origin "https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/${{ github.repository }}.git"
          git push origin main --follow-tags
