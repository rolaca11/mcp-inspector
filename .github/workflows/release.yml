name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to release (for example, 1.7.0)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate release version
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Run releases from main" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "Enter a SemVer version without the v prefix" >&2
            exit 1
          fi
          TAG="v${RELEASE_VERSION}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set package versions
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          npm pkg set "version=$RELEASE_VERSION" --workspaces --include-workspace-root
          bun install --lockfile-only
          bun scripts/sync-lockfile-versions.mjs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Tag release commit
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json packages/*/package.json bun.lock
          git commit -m "Release $RELEASE_TAG"
          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ contains(inputs.version, '-') }}

  publish:
    if: ${{ !contains(inputs.version, '-') }}
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Publish to npm
        run: npm publish --access public
        working-directory: packages/cli

  electron:
    name: Electron (${{ matrix.platform }})
    needs: build
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install AppImage update tooling
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes zsync

      - name: Build & Package
        run: bun run dist:electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Create Linux archive
        if: matrix.platform == 'linux'
        run: tar -czf packages/electron/release/mcp-inspector-linux-x86_64.tar.gz -C packages/electron/release linux-unpacked

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          files: |
            packages/electron/release/*.AppImage
            packages/electron/release/*.AppImage.zsync
            packages/electron/release/*.tar.gz
            packages/electron/release/*.dmg
            packages/electron/release/*.zip
            packages/electron/release/*.yml
