name: Upload to Launchpad
description: Sign the source uploads in a directory and send the ones Launchpad does not have yet

inputs:
  source-directory:
    required: true
  gpg-private-key:
    required: true
  gpg-passphrase:
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install upload tools
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends devscripts dput gnupg

    - name: Import and test signing key
      shell: bash
      env:
        PPA_GPG_PRIVATE_KEY: ${{ inputs.gpg-private-key }}
        PPA_GPG_PASSPHRASE: ${{ inputs.gpg-passphrase }}
      run: node scripts/ppa-gpg.mjs setup

    - name: Sign and upload missing Ubuntu source packages
      shell: bash
      env:
        PPA_SOURCE_DIRECTORY: ${{ inputs.source-directory }}
      run: node scripts/upload-ppa.mjs --output "$PPA_SOURCE_DIRECTORY" --batch --passphrase-file "$PPA_GPG_PASSPHRASE_FILE"

    - name: Remove signing credentials
      if: ${{ always() && env.PPA_GPG_CREDENTIALS_DIRECTORY != '' }}
      shell: bash
      run: node scripts/ppa-gpg.mjs cleanup
