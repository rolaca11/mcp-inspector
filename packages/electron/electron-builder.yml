appId: com.rolaca11.mcp-inspector
productName: MCP Inspector
directories:
  output: release
files:
  - dist/**/*
  - package.json
extraResources:
  - from: ../web/dist
    to: web
    filter:
      - "**/*"
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
win:
  target:
    - nsis
linux:
  target:
    - AppImage
    - flatpak
  artifactName: "mcp-inspector.${ext}"
  category: Development
