appId: dev.ropi.mcp-inspector
productName: MCP Inspector
protocols:
  - name: MCP Inspector
    schemes:
      - mcp-inspector
directories:
  output: release
files:
  - dist/**/*
  - package.json
extraResources:
  - from: ../web/dist
    to: web
    filter:
      - "**/*"
afterAllArtifactBuild: build/appimage-update-info.cjs
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
linux:
  target:
    - AppImage
  artifactName: "mcp-inspector.${ext}"
  category: Development
