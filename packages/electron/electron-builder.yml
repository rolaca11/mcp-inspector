appId: dev.ropi.mcp-inspector
productName: MCP Inspector
protocols:
  - name: MCP Inspector
    schemes:
      - mcp-inspector
directories:
  output: release
files:
  - dist/**/*
  - package.json
  - from: ../web/dist
    to: dist/web
    filter:
      - "**/*"
extraResources:
  - from: ../web/dist
    to: web
    filter:
      - "**/*"
afterAllArtifactBuild: build/appimage-update-info.cjs
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
linux:
  target:
    - AppImage
    - deb
  executableName: mcp-inspector-desktop
  artifactName: "mcp-inspector.${ext}"
  category: Development
deb:
  packageName: mcp-inspector
  artifactName: "mcp-inspector_${version}_${arch}.${ext}"
  maintainer: "rolaca11 <rolaca11@users.noreply.github.com>"
  fpm:
    - build/mcp-inspector=/usr/bin/mcp-inspector
